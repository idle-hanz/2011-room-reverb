name: assemble-fdn-hex
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble fdn.py from hex parts
        run: |
          python3 << 'PY'
          from pathlib import Path
          import hashlib, re
          root = Path("software/engine/.fdn_hex")
          frags = sorted(root.glob("*.hex"))
          print("frags", [p.name for p in frags])
          hx = "".join(p.read_text().strip() for p in frags)
          hx = re.sub(r"[^0-9a-fA-F]", "", hx)
          raw = bytes.fromhex(hx)
          blob = hashlib.sha1(b"blob %d" % len(raw) + bytes([0]) + raw).hexdigest()
          print("hex_len", len(hx), "raw", len(raw), "blob", blob)
          assert blob == "f9781353a73437ed4aa1ca31509ae0fbcebfa159", blob
          text = raw.decode("utf-8")
          print("first", text.splitlines()[0][:100])
          assert "__LOAD__" not in text[:200]
          Path("software/engine/fdn.py").write_bytes(raw)
          PY
      - name: Commit fdn.py and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf software/engine/.fdn_hex software/engine/.fdn_b64
          rm -f .github/workflows/fix-fdn-b64-01.yml .github/workflows/assemble-fdn-hex.yml
          git add -A
          git status
          git commit -m "Add software/engine/fdn.py"
          git push
