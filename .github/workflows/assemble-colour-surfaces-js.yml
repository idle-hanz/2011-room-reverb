name: assemble-colour-surfaces-js
on:
  workflow_dispatch:
  push:
    paths:
      - "assemble/colour-surfaces-js/**"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble from hex
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import hashlib, json
          root = Path("assemble/colour-surfaces-js")
          meta = json.loads((root / "meta.json").read_text())
          parts = sorted(root.glob("part_*.hex"))
          assert len(parts) == meta["n"], (len(parts), meta["n"])
          hexdata = "".join(p.read_text().strip() for p in parts)
          assert len(hexdata) == meta["total_hex"], (len(hexdata), meta["total_hex"])
          text = bytes.fromhex(hexdata).decode("utf-8")
          assert len(text) == meta["target_len"], (len(text), meta["target_len"])
          assert hashlib.sha256(text.encode()).hexdigest() == meta["sha256"]
          assert text.startswith(meta["startswith"])
          assert "PLACEHOLDER" not in text
          out = Path(meta["out_path"])
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding="utf-8")
          print("wrote", out, "len", len(text))
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "software/static/js/colour_surfaces.js"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Assemble software/static/js/colour_surfaces.js to target_len"
          git push
