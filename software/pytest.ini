[pytest]
# Fast is the default. Before a push: pytest -m slow
# -n auto asks conftest for half the logical processors. A full set starves
# each render. loadscope keeps one module on one worker.
# Expensive setup renders are cached in software/.render_cache.
# --no-render-cache or RR_NO_RENDER_CACHE=1 forces a fresh render.
addopts = -n auto --dist loadscope -m "not slow"
